<div class="timing-board">
  <table>
    <thead>
      <tr>
        <th>PILOTO</th>
        <th>VOLTA</th>
        <th>TEMPO (ms)</th>
        <th>PNEU</th>
      </tr>
    </thead>
    <tbody>
      
      <!-- Utilização da nova sintaxe @for do Angular 17+ -->
      @for (lap of laps; track lap.id) {
        <tr>
          <td class="driver-col">{{ lap.driverNumber }}</td>
          <td>{{ lap.lapNumber }}</td>
          <td class="time-col">{{ lap.lapDurationMs | lapTimeFormat }}</td>
          <td>
            <!-- Prevenção de erro: se tireCompound for null, usamos 'unknown' -->
            <span class="tire-badge" [ngClass]="(lap.tireCompound | lowercase) || 'unknown'">
              {{ lap.tireCompound || 'N/A' }}
            </span>
          </td>
        </tr>
      } @empty {
        <!-- Aparece enquanto nenhuma volta chega -->
        <tr>
          <td colspan="4" style="text-align: center; color: #888; padding: 20px;">
            Aguardando início da sessão (nenhuma volta recebida)...
          </td>
        </tr>
      }

    </tbody>
  </table>
</div>
